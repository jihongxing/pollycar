spec_version: "1.0"
spec_id: "pollycar.security.data-classification"
language: "zh-CN"
production_enabled: false
status: "review"
source_document: "docs/11-data-classification.md"

levels:
  - id: "L0"
    name: "公开"
    authentication_required: false
    encryption_in_transit: true
    encryption_at_rest: "recommended"
    audit: "publication"
    non_production: "allowed"
    logging: "allowed"
  - id: "L1"
    name: "内部"
    authentication_required: true
    encryption_in_transit: true
    encryption_at_rest: "recommended"
    audit: "administrative_changes"
    non_production: "allowed_with_control"
    logging: "minimized"
  - id: "L2"
    name: "敏感"
    authentication_required: true
    encryption_in_transit: true
    encryption_at_rest: "required"
    audit: "read_write"
    non_production: "deidentified_only"
    logging: "no_direct_identifiers"
  - id: "L3"
    name: "高敏感"
    authentication_required: true
    encryption_in_transit: true
    encryption_at_rest: "required"
    audit: "full_read_write"
    non_production: "synthetic_or_strongly_deidentified"
    logging: "forbidden_raw"
  - id: "L4"
    name: "严格受限"
    authentication_required: true
    strong_authentication_required: true
    encryption_in_transit: true
    encryption_at_rest: "separate_key_or_vault"
    audit: "full_read_write_export"
    non_production: "production_raw_forbidden"
    logging: "absolutely_forbidden_raw"

fields:
  - id: "account.internal_id"
    classification: "L2"
  - id: "account.phone"
    classification: "L3"
  - id: "account.email"
    classification: "L3"
  - id: "identity.verification_result"
    classification: "L3"
  - id: "identity.document_number"
    classification: "L4"
  - id: "identity.document_image"
    classification: "L4"
  - id: "identity.liveness_material"
    classification: "L4"
  - id: "vehicle.plate_number"
    classification: "L3"
  - id: "vehicle.identification_number"
    classification: "L4"
  - id: "vehicle.ownership_document"
    classification: "L4"
  - id: "vehicle.insurance_document"
    classification: "L4"
  - id: "trip.id"
    classification: "L2"
  - id: "trip.approximate_area"
    classification: "L2"
  - id: "trip.detailed_address"
    classification: "L3"
  - id: "trip.realtime_location"
    classification: "L4"
  - id: "trip.precise_location_trace"
    classification: "L4"
  - id: "payment.summary"
    classification: "L3"
  - id: "analytics.executive_metric_snapshot"
    classification: "L2"
  - id: "analytics.executive_finance_band"
    classification: "L2"
  - id: "analytics.executive_finance_exact_aggregate"
    classification: "L3"
  - id: "payment.provider_transaction"
    classification: "L4"
  - id: "payment.full_credential"
    classification: "L4"
    platform_storage: "forbidden"
  - id: "eligibility.status"
    classification: "L2"
  - id: "eligibility.review_material"
    classification: "L4"
  - id: "risk.signals"
    classification: "L4"
  - id: "risk.rules_and_thresholds"
    classification: "L4"
  - id: "chat.status"
    classification: "L2"
  - id: "chat.message_body"
    classification: "L4"
  - id: "safety.report_status"
    classification: "L3"
  - id: "safety.reporter_identity"
    classification: "L4"
  - id: "safety.evidence"
    classification: "L4"
  - id: "audit.sensitive_access"
    classification: "L4"
  - id: "secret.credential"
    classification: "L4"
    platform_logging: "forbidden"

combination_rule: "use_highest_classification"
event_payload_rule: "references_and_minimum_summary_only"

spec_version: "2.0"
spec_id: "pollycar.admin.role-access-matrix"
language: "zh-CN"
production_enabled: false
status: "design_frozen"
source_document: "docs/decisions/0033-运营后台三级授权模型迁移.md"
decision: "docs/decisions/0033-运营后台三级授权模型迁移.md"

design_approval:
  design_frozen: true
  frozen_on: "2026-07-30"
  implementation_approved: true
  explicit_implementation_approval_required: true

feature_gate:
  id: "synthetic_admin_role_access_matrix"
  default_enabled: false
  dependencies: ["internal_sandbox", "synthetic_admin_multi_organization", "synthetic_admin_authentication"]
  deny_on_missing_dependency: true
  production_enable_forbidden: true

authorization:
  default_effect: "deny"
  platform_identity_implies_all_permissions: false
  universal_administrator_forbidden: true
  client_authorization_claim_trusted: false
  server_navigation_authoritative: true
  every_route_reauthorized: true
  every_operation_reauthorized: true
  field_level_server_filter_required: true
  export_reauthorization_required: true

authorization_levels:
  - id: "level_1"
    name: "运营执行员"
    organizations: ["platform", "operator"]
    maximum_actions: ["view", "claim", "process", "request_material", "submit_request"]
  - id: "level_2"
    name: "运营负责人"
    organizations: ["platform", "operator"]
    maximum_actions: ["view", "claim", "process", "assign", "review", "close", "temporary_restrict", "temporary_restore"]
  - id: "level_3"
    name: "平台控制与独立审核"
    organizations: ["platform"]
    maximum_actions: ["view", "cross_organization_governance", "final_decision", "independent_review"]

organization_scopes:
  platform:
    explicit_city_scope_required: true
    explicit_operator_scope_required: true
    global_scope_forbidden: true
  operator:
    operator_id_fixed: true
    city_scope_intersects_active_capabilities: true
    level_3_forbidden: true
  common:
    wildcard_operator_scope_forbidden: true
    request_filters_may_only_narrow_scope: true
    search_count_aggregate_and_export_share_scope: true

business_capabilities:
  - id: "operations_task"
    menus: ["workbench"]
    minimum_level: "level_1"
  - id: "operator_governance"
    menus: ["operator_management", "driver_vehicle"]
    minimum_level: "level_1"
  - id: "fleet_operation"
    menus: ["driver_vehicle"]
    minimum_level: "level_1"
  - id: "fleet_review"
    menus: ["driver_vehicle"]
    minimum_level: "level_1"
  - id: "trip_operation"
    menus: ["trip_operations"]
    minimum_level: "level_1"
  - id: "support_case"
    menus: ["trip_operations", "support_safety"]
    minimum_level: "level_1"
  - id: "safety_investigation"
    menus: ["driver_vehicle", "trip_operations", "support_safety"]
    minimum_level: "level_1"
  - id: "safety_restoration_review"
    menus: ["support_safety"]
    minimum_level: "level_2"
  - id: "finance_operation"
    menus: ["finance_operations"]
    minimum_level: "level_1"
  - id: "finance_review"
    menus: ["finance_operations", "data_reports"]
    minimum_level: "level_2"
  - id: "privacy_governance"
    menus: ["support_safety", "finance_operations", "data_reports", "executive_dashboard", "audit_system"]
    minimum_level: "level_3"
  - id: "analytics_read"
    menus: ["data_reports"]
    minimum_level: "level_1"
  - id: "audit_read"
    menus: ["organization_accounts", "operator_management", "driver_vehicle", "trip_operations", "support_safety", "finance_operations", "data_reports", "audit_system"]
    minimum_level: "level_2"
  - id: "technical_recovery"
    menus: ["audit_system"]
    minimum_level: "level_3"
  - id: "executive_read"
    menus: ["data_reports", "executive_dashboard"]
    minimum_level: "level_2"
  - id: "membership_governance"
    menus: ["organization_accounts", "audit_system"]
    minimum_level: "level_2"

legacy_role_migration:
  runtime_compatibility: false
  authorization_by_legacy_role_forbidden: true
  mappings:
    platform_access_administrator: {level: "level_3", capabilities: ["membership_governance"]}
    operations_officer: {level: "level_1", capabilities: ["operations_task", "operator_governance", "fleet_operation", "trip_operation", "analytics_read"]}
    operations_lead: {level: "level_2", capabilities: ["operations_task", "operator_governance", "fleet_operation", "trip_operation", "analytics_read", "executive_read"]}
    operator_management_officer: {level: "level_2", capabilities: ["operator_governance", "fleet_operation"]}
    reviewer: {level: "level_1", capabilities: ["fleet_review"]}
    senior_reviewer: {level: "level_2", capabilities: ["operator_governance", "fleet_review"]}
    customer_support: {level: "level_1", capabilities: ["operations_task", "trip_operation", "support_case"]}
    support_lead: {level: "level_2", capabilities: ["operations_task", "trip_operation", "support_case", "analytics_read"]}
    safety_officer: {level: "level_1", capabilities: ["safety_investigation"]}
    safety_lead: {level: "level_2", capabilities: ["safety_investigation", "safety_restoration_review", "analytics_read", "executive_read"]}
    finance_officer: {level: "level_1", capabilities: ["finance_operation"]}
    finance_lead: {level: "level_2", capabilities: ["finance_operation", "finance_review", "analytics_read", "executive_read"]}
    privacy_compliance: {level: "level_3", capabilities: ["privacy_governance"]}
    data_analyst: {level: "level_1", capabilities: ["analytics_read"]}
    auditor: {level: "level_3", capabilities: ["audit_read"]}
    technical_operations: {level: "level_3", capabilities: ["technical_recovery"]}
    executive_sponsor: {level: "level_3", capabilities: ["executive_read"]}
    operator_account_administrator: {level: "level_2", capabilities: ["membership_governance"]}
    operator_operations_lead: {level: "level_2", capabilities: ["operations_task", "operator_governance", "fleet_operation", "trip_operation", "analytics_read"]}
    operator_fleet_officer: {level: "level_1", capabilities: ["fleet_operation"]}
    operator_customer_support: {level: "level_1", capabilities: ["operations_task", "trip_operation", "support_case"]}
    operator_safety_liaison: {level: "level_1", capabilities: ["safety_investigation"]}
    operator_finance_officer: {level: "level_1", capabilities: ["finance_operation"]}
    operator_finance_lead: {level: "level_2", capabilities: ["finance_operation", "finance_review", "analytics_read"]}
    operator_auditor: {level: "level_2", capabilities: ["audit_read"]}
    operator_executive: {level: "level_2", capabilities: ["executive_read"]}

navigation:
  - id: "workbench"
    route_prefix: "/admin/workbench"
  - id: "organization_accounts"
    route_prefix: "/admin/organization-accounts"
  - id: "operator_management"
    route_prefix: "/admin/operators"
  - id: "driver_vehicle"
    route_prefix: "/admin/fleet"
  - id: "trip_operations"
    route_prefix: "/admin/trips"
  - id: "support_safety"
    route_prefix: "/admin/cases"
  - id: "finance_operations"
    route_prefix: "/admin/finance"
  - id: "data_reports"
    route_prefix: "/admin/reports"
  - id: "executive_dashboard"
    route_prefix: "/admin/executive"
  - id: "audit_system"
    route_prefix: "/admin/governance"

route_policy:
  unauthorized_menu_hidden: true
  direct_route_reauthorization_required: true
  unauthorized_module_result: "forbidden_without_resource_disclosure"
  unauthorized_resource_result: "not_found_without_existence_disclosure"
  stale_navigation_manifest_forbidden: true

separation_of_duties:
  forbidden_combinations:
    - ["audit_read", "business_write"]
    - ["technical_recovery", "business_decision"]
    - ["finance_operation", "same_record_finance_review"]
    - ["safety_investigation", "same_case_safety_restoration_review"]
  high_risk_requirements:
    reason_code_required: true
    expected_version_required: true
    idempotency_key_required: true
    independent_review_required: true
    append_only_audit_required: true

field_profiles:
  operational_masked: {maximum_classification: "L3", raw_l3_forbidden: true}
  assigned_review: {maximum_classification: "L4", assigned_case_required: true, temporary_grant_required: true}
  safety_evidence: {maximum_classification: "L4", linked_case_required: true, dual_approval_required: true}
  finance_exact: {maximum_classification: "L3", full_payment_credential_forbidden: true, full_bank_account_forbidden: true}
  aggregate_only: {maximum_classification: "L2", deidentified_only: true}
  technical_metadata: {maximum_classification: "L2", business_payload_forbidden: true}

export_profiles:
  none: {allowed: false}
  aggregate: {allowed: true, maximum_classification: "L2"}
  scoped: {allowed: true, purpose_required: true, short_lived_encrypted_file_required: true}
  controlled: {allowed: true, independent_approval_required: true}

bulk_actions:
  allowed: ["task_assign", "task_tag", "controlled_notification", "queue_coordination"]
  forbidden: ["approve", "reject", "safety_restore", "payout", "refund", "reversal", "role_grant"]

implementation_gate:
  implementation_allowed: true
  navigation_api_forbidden_before_approval: false
  real_accounts_allowed: false
  production_enablement_allowed: false

spec_version: "2.0"
spec_id: "pollycar.tests.admin-role-access-matrix-scenarios"
language: "zh-CN"
production_enabled: false
status: "design_frozen"
source_document: "docs/decisions/0033-运营后台三级授权模型迁移.md"

scenarios:
  - id: "ADMIN-RBAC-001"
    category: feature_gate
    title: "授权模型门禁关闭时拒绝签发导航"
    actor: level_2_operations
    command: admin_authorization.navigation.issue
    expected: denied
    expected_error: "FEATURE_DISABLED"
  - id: "ADMIN-RBAC-002"
    category: implementation_gate
    title: "生产启用未批准时保持关闭"
    actor: level_3_platform_control
    command: admin_authorization.production.enable
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-003"
    category: authorization_level
    title: "一级只能执行处理类操作"
    actor: level_1_operations
    command: admin_authorization.operation.review
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-004"
    category: authorization_level
    title: "二级可以复核职责范围内任务"
    actor: level_2_operations
    command: admin_authorization.operation.review
    expected: allowed
    expected_error: null
  - id: "ADMIN-RBAC-005"
    category: authorization_level
    title: "运营公司禁止配置三级"
    actor: operator_membership_governance
    command: admin_authorization.level.assign
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-006"
    category: authorization_level
    title: "三级不自动获得全部业务写权限"
    actor: level_3_audit
    command: admin_authorization.operation.execute
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-007"
    category: capability
    title: "没有业务能力时隐藏对应导航"
    actor: analytics_read
    command: admin_authorization.navigation.operator_management
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-008"
    category: capability
    title: "运力审核能力允许认领审核任务"
    actor: fleet_review
    command: admin_authorization.vehicle.claim
    expected: allowed
    expected_error: null
  - id: "ADMIN-RBAC-009"
    category: capability
    title: "普通运力运营能力不能最终批准"
    actor: fleet_operation
    command: admin_authorization.vehicle.approve
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-010"
    category: capability
    title: "技术恢复能力不能执行业务裁决"
    actor: technical_recovery
    command: admin_authorization.business.decide
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-011"
    category: separation
    title: "审计只读能力不能与业务写权限组合"
    actor: audit_read
    command: admin_authorization.capability.combine
    expected: denied
    expected_error: "AUTHORIZATION_SEPARATION_OF_DUTIES"
  - id: "ADMIN-RBAC-012"
    category: separation
    title: "财务制单人不能复核同一记录"
    actor: finance_operation
    command: admin_authorization.finance.same_record_review
    expected: denied
    expected_error: "AUTHORIZATION_SEPARATION_OF_DUTIES"
  - id: "ADMIN-RBAC-013"
    category: separation
    title: "安全调查人不能复核同一案件恢复"
    actor: safety_investigation
    command: admin_authorization.safety.same_case_restore
    expected: denied
    expected_error: "AUTHORIZATION_SEPARATION_OF_DUTIES"
  - id: "ADMIN-RBAC-014"
    category: navigation
    title: "导航由服务端能力集合生成"
    actor: support_case
    command: admin_authorization.navigation.issue
    expected: support_navigation
    expected_error: null
  - id: "ADMIN-RBAC-015"
    category: navigation
    title: "客户端增加能力声明不能扩大导航"
    actor: level_1_operations
    command: admin_authorization.navigation.forge
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-016"
    category: route
    title: "直接访问无能力路由仍被拒绝"
    actor: analytics_read
    command: admin_authorization.route.operator_management
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-017"
    category: route
    title: "过期导航清单不能执行写操作"
    actor: level_2_operations
    command: admin_authorization.route.stale_write
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-018"
    category: organization_scope
    title: "运营公司只能读取本组织记录"
    actor: operator_operations
    command: admin_authorization.scope.read
    expected: own_operator_only
    expected_error: null
  - id: "ADMIN-RBAC-019"
    category: organization_scope
    title: "运营公司修改组织参数不能越权"
    actor: operator_operations
    command: admin_authorization.scope.expand_operator
    expected: denied
    expected_error: "ADMIN_OPERATOR_SCOPE_FORBIDDEN"
  - id: "ADMIN-RBAC-020"
    category: organization_scope
    title: "平台身份也必须具有明确运营公司范围"
    actor: level_2_operations
    command: admin_authorization.scope.wildcard
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-021"
    category: operation
    title: "一级可以处理已认领任务"
    actor: level_1_operations
    command: admin_authorization.task.process
    expected: allowed
    expected_error: null
  - id: "ADMIN-RBAC-022"
    category: operation
    title: "一级不能关闭待复核任务"
    actor: level_1_operations
    command: admin_authorization.task.close
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-023"
    category: operation
    title: "运营公司不能执行平台最终准入"
    actor: operator_fleet
    command: admin_authorization.admission.final_approve
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-024"
    category: operation
    title: "未知操作默认拒绝"
    actor: level_3_platform_control
    command: admin_authorization.operation.unknown
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-025"
    category: field
    title: "日常运营默认读取脱敏字段"
    actor: fleet_operation
    command: admin_authorization.field.read
    expected: masked_l3
    expected_error: null
  - id: "ADMIN-RBAC-026"
    category: field
    title: "未分配案件不能读取严格受限材料"
    actor: fleet_review
    command: admin_authorization.field.read_restricted
    expected: denied
    expected_error: "ADMIN_TEMPORARY_GRANT_REQUIRED"
  - id: "ADMIN-RBAC-027"
    category: field
    title: "技术恢复只能读取技术元数据"
    actor: technical_recovery
    command: admin_authorization.field.read_business_payload
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-028"
    category: export
    title: "无导出档位时拒绝导出"
    actor: technical_recovery
    command: admin_authorization.export.request
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"
  - id: "ADMIN-RBAC-029"
    category: export
    title: "导出范围不得超过页面范围"
    actor: operator_finance
    command: admin_authorization.export.expand_scope
    expected: denied
    expected_error: "ADMIN_OPERATOR_SCOPE_FORBIDDEN"
  - id: "ADMIN-RBAC-030"
    category: export
    title: "受控导出必须独立审批"
    actor: executive_read
    command: admin_authorization.export.approve_self
    expected: denied
    expected_error: "AUTHORIZATION_SEPARATION_OF_DUTIES"
  - id: "ADMIN-RBAC-031"
    category: bulk_action
    title: "低风险批量任务分派保持服务端范围"
    actor: level_2_operations
    command: admin_authorization.bulk.task_assign
    expected: allowed_with_scope
    expected_error: null
  - id: "ADMIN-RBAC-032"
    category: bulk_action
    title: "批量准入资金和安全恢复全部禁止"
    actor: level_3_platform_control
    command: admin_authorization.bulk.high_risk_decision
    expected: denied
    expected_error: "AUTHORIZATION_DENIED"

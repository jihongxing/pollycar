    allowed_errors: ["AUTHENTICATION_REQUIRED", "MAP_COORDINATE_SYSTEM_REQUIRED", "MAP_COORDINATE_INVALID", "MAP_COORDINATE_PRECISION_EXCEEDED", "MAP_ROUTE_INVALID", "MAP_PROVIDER_TIMEOUT", "MAP_PROVIDER_UNAVAILABLE", "MAP_QUOTA_DEGRADED", "INTERNAL_UNEXPECTED_ERROR"]

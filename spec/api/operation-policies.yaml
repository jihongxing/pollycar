    audit: "sensitive"
    allowed_errors: ["AUTHENTICATION_REQUIRED", "VEHICLE_LOCATION_FORBIDDEN", "VEHICLE_LOCATION_ACCURACY_INVALID", "VEHICLE_LOCATION_TOO_FREQUENT", "VEHICLE_LOCATION_SEQUENCE_INVALID", "VEHICLE_LOCATION_TIMESTAMP_INVALID", "VEHICLE_LOCATION_STREAM_STOPPED", "VEHICLE_LOCATION_TRIP_MISMATCH", "MAP_COORDINATE_SYSTEM_REQUIRED", "MAP_COORDINATE_INVALID", "MAP_COORDINATE_PRECISION_EXCEEDED", "INTERNAL_UNEXPECTED_ERROR"]
    acceptance_scenarios: ["MOB-016"]
  - operation_id: "setAppVehicleLocationStage"

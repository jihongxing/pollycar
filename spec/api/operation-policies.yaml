  - operation_id: "getAppVehicleLocation"
    method: "GET"
    path: "/v1/internal-sandbox/app/synthetic-trips/{trip_id}/vehicle-location"
    authorization_action: "map.vehicle_location.read"
    actors: ["passenger", "driver"]
    request_classification: "L0"
    response_classification: "L2"
    idempotency_required: false
    audit: "standard"
    allowed_errors: ["AUTHENTICATION_REQUIRED", "VEHICLE_LOCATION_FORBIDDEN", "INTERNAL_UNEXPECTED_ERROR"]
    acceptance_scenarios: ["MOB-017"]
  - operation_id: "uploadAppVehicleLocation"

    acceptance_scenarios: ["MOB-018"]

global_rules:
  write_methods: ["POST", "PUT", "PATCH", "DELETE"]
  all_operations_require_authentication: true
  all_write_operations_require_idempotency: true
  all_operations_require_operation_id: true
  all_operations_require_error_response: true
  forbidden_actions: ["quota.override"]
  forbidden_response_fields: ["risk_score", "risk_threshold", "reporter_identity", "chat_message_body", "precise_location_trace", "full_payment_credential"]



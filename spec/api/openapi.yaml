      summary: 接收车主活体供应商签名回调
      description: 回调必须验签并以 callbackId 幂等处理；未知、超时或失败结果不得签发上线授权。
      security:
        - identityProviderSignature: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Provider-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [callbackId, challengeId, providerSessionReference, occurredAt, status, policyVersion]
              properties:
                callbackId: { type: string }
                challengeId: { type: string }
                providerSessionReference: { type: string }
                occurredAt: { type: string, format: date-time }
                status: { type: string, enum: [passed, failed, pending, unknown] }
                policyVersion: { type: string }
                failureCode: { type: string }
                requestDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: 幂等处理后的活体检测结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverLivenessResult" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }

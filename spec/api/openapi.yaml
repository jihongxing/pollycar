openapi: 3.1.0
info:
  title: PollyCar API
  version: 0.2.0
  description: |
    PollyCar 弹性参与资格最小 API 契约。
    当前规范处于评审状态，不代表付费弹性资格已批准生产启用。
servers:
  - url: https://api.invalid.pollycar.example
    description: 占位地址，不可用于生产
tags:
  - name: DriverFlexEligibility
    description: 车主本人弹性参与资格
  - name: EligibilityReview
    description: 审核与安全后台
  - name: EligibilityFinance
    description: 资格费用与退款查询
  - name: InternalSandboxApp
    description: 用户 App 合成车辆审核
  - name: InternalSandboxAdmin
    description: 运营后台合成车辆审核
paths:
  /v1/auth/phone/code:
    post:
      tags: [InternalSandboxApp]
      operationId: requestPhoneAuthenticationCode
      summary: 请求手机号验证码
      security:
        []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestPhoneCodeRequest" }
      responses:
        "201":
          description: 验证码挑战已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneCodeChallenge" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "422": { $ref: "#/components/responses/BusinessRuleError" }
  /v1/auth/phone/verify:
    post:
      tags: [InternalSandboxApp]
      operationId: verifyPhoneAuthenticationCode
      summary: 验证手机号验证码并登录或注册
      security:
        []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPhoneCodeRequest" }
      responses:
        "200":
          description: 认证成功并签发访问令牌及轮换刷新会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneAuthenticationResult" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/BusinessRuleError" }
  /v1/auth/session/refresh:
    post:
      tags: [InternalSandboxApp]
      operationId: refreshPhoneAuthenticationSession
      summary: 轮换刷新会话并签发新访问令牌
      security:
        []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshPhoneSessionRequest" }
      responses:
        "200":
          description: 会话轮换成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneAuthenticationResult" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
  /v1/internal-sandbox/app/sessions:
    post:
      tags: [InternalSandboxApp]
      operationId: createAppAccountSession
      summary: 创建内部账户会话
      security:
        []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInternalAccountSessionRequest" }
      responses:
        "201":
          description: 会话已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInternalAccountSessionResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /v1/internal-sandbox/app/sessions/current:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppAccountSession
      summary: 获取当前内部账户会话
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalAccountSession" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
  /v1/internal-sandbox/app/sessions/current/identity:
    post:
      tags: [InternalSandboxApp]
      operationId: switchAppAccountSessionIdentity
      summary: 切换当前账户身份
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activeIdentity]
              properties:
                activeIdentity: { type: string, enum: [passenger, driver] }
      responses:
        "200":
          description: 身份已切换
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalAccountSession" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /v1/internal-sandbox/app/sessions/current/revoke:
    post:
      tags: [InternalSandboxApp]
      operationId: revokeAppAccountSession
      summary: 撤销当前内部账户会话
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 会话已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalAccountSession" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
  /v1/internal-sandbox/app/synthetic-trips/{trip_id}/chat/content-deletion:
    post:
      tags: [InternalSandboxApp]
      operationId: deleteAppTripChatContent
      summary: 在保留期届满且无证据保留锁时删除聊天正文
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 删除后的会话摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripChatView" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /v1/internal-sandbox/app/trust-profile:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppTrustProfile
      summary: 获取本人合成头像审核与评分摘要
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 本人信任资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTrustProfile" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/internal-sandbox/app/trust-profile/avatar:
    post:
      tags: [InternalSandboxApp]
      operationId: submitAppAvatar
      summary: 提交预设头像或内部沙箱自定义头像
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [asset]
                  properties:
                    asset:
                      type: string
                      enum: [avatar-city-blue, avatar-warm-gray, avatar-plum]
                - type: object
                  required: [fileName, mimeType, byteSize, contentBase64]
                  properties:
                    fileName: { type: string, minLength: 1, maxLength: 120 }
                    mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                    byteSize: { type: integer, minimum: 1, maximum: 1500000 }
                    contentBase64:
                      type: string
                      minLength: 1
                      maxLength: 2000008
      responses:
        "200":
          description: 审核后的本人信任资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTrustProfile" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          description: 头像文件过大
        "422":
          description: 图片格式或尺寸无效
  /v1/internal-sandbox/media/avatars/{objectKey}:
    get:
      tags: [InternalSandboxApp]
      operationId: getApprovedAvatarMedia
      summary: 读取仍被账户资料引用的已通过头像
      security:
        - avatarMediaToken: []
      parameters:
        - in: path
          name: objectKey
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 头像图片
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/internal-sandbox/app/trust-profile/fairness:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppFairnessReport
      summary: 获取不参与自动决策的合成公平性报告
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 公平性监测报告
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FairnessMonitoringReport" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/internal-sandbox/app/synthetic-trips/{trip_id}/rating:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppTripRating
      summary: 获取本人对指定行程的评价
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: 评价或空结果
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
    post:
      tags: [InternalSandboxApp]
      operationId: submitAppTripRating
      summary: 提交已完成行程评价
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                note: { type: string, maxLength: 200 }
      responses:
        "200":
          description: 已记录评价
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripRating" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
  /v1/internal-sandbox/app/synthetic-trips/{trip_id}/chat:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppTripChat
      summary: 获取合成行程会话
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: 合成会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripChatView" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/internal-sandbox/app/synthetic-trips/{trip_id}/chat/messages:
    post:
      tags: [InternalSandboxApp]
      operationId: sendAppTripChatMessage
      summary: 发送合成行程消息
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TripId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 500 }
              additionalProperties: false
      responses:
        "200":
          description: 更新后的合成会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripChatView" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/internal-sandbox/app/messages:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppMessageCenter
      summary: 获取合成消息中心
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 合成消息中心
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCenterView" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/internal-sandbox/app/messages/{item_id}/read:
    post:
      tags: [InternalSandboxApp]
      operationId: markAppMessageRead
      summary: 标记单条合成消息已读
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 更新后的消息中心
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCenterView" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/internal-sandbox/app/messages/read-all:
    post:
      tags: [InternalSandboxApp]
      operationId: markAllAppMessagesRead
      summary: 标记全部合成消息已读
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 更新后的消息中心
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCenterView" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/drivers/me/flex-eligibility/applications:
    post:
      tags: [DriverFlexEligibility]
      operationId: submitFlexEligibilityApplication
      summary: 提交弹性参与资格申请
      description: 仅车主本人可提交；付费试验采用先审核后收费。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlexEligibilityApplicationRequest"
      responses:
        "202":
          description: 申请已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/drivers/me/flex-eligibility:
    get:
      tags: [DriverFlexEligibility]
      operationId: getMyFlexEligibility
      summary: 查询本人弹性参与资格
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前资格状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
  /v1/drivers/me/flex-eligibility/confirmation:
    post:
      tags: [DriverFlexEligibility]
      operationId: confirmFlexEligibilityActivation
      summary: 确认启用资格
      description: 禁止默认自动续期；车主必须主动接受当前条款和价格版本。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlexEligibilityConfirmationRequest"
      responses:
        "202":
          description: 确认已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/drivers/me/flex-eligibility/appeals:
    post:
      tags: [DriverFlexEligibility]
      operationId: submitFlexEligibilityAppeal
      summary: 提交资格申诉
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlexEligibilityAppealRequest"
      responses:
        "202":
          description: 申诉已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/admin/flex-eligibility/applications/{application_id}/decision:
    post:
      tags: [EligibilityReview]
      operationId: decideFlexEligibilityApplication
      summary: 审核资格申请
      description: 普通或高级审核员可处理；申诉复核不得由原决定人完成。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityDecisionRequest"
      responses:
        "200":
          description: 审核决定已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/admin/flex-eligibilities/{eligibility_id}/suspension:
    post:
      tags: [EligibilityReview]
      operationId: suspendFlexEligibility
      summary: 暂停弹性参与资格
      description: 安全或授权审核角色使用，不能由财务或客服执行。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EligibilityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityRestrictionRequest"
      responses:
        "200":
          description: 资格已暂停
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
    delete:
      tags: [EligibilityReview]
      operationId: clearFlexEligibilitySuspension
      summary: 解除资格暂停原因
      description: 解除后进入待恢复，仍需通过恢复守卫。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EligibilityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 暂停原因已解除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/admin/flex-eligibilities/{eligibility_id}/revocation:
    post:
      tags: [EligibilityReview]
      operationId: revokeFlexEligibility
      summary: 撤销弹性参与资格
      description: 仅安全人员或安全负责人可执行，并必须关联安全案件。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EligibilityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityRestrictionRequest"
      responses:
        "200":
          description: 资格已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/admin/flex-eligibility/appeals/{appeal_id}/decision:
    post:
      tags: [EligibilityReview]
      operationId: decideFlexEligibilityAppeal
      summary: 复核资格申诉
      description: 必须由非原决定人员处理。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppealId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealDecisionRequest"
      responses:
        "200":
          description: 申诉决定已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlexEligibilityResource"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /v1/admin/flex-eligibilities/{eligibility_id}/financial-status:
    get:
      tags: [EligibilityFinance]
      operationId: getFlexEligibilityFinancialStatus
      summary: 查询资格支付和退款状态
      description: 只返回财务摘要，不返回完整支付凭据或安全证据。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EligibilityId"
      responses:
        "200":
          description: 支付和退款摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityFinancialStatus"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":

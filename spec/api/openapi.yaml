        "200":
          description: 五分钟有效、动作顺序固定的合成活体挑战
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverLivenessChallenge" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/BusinessRuleError" }

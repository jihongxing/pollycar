          enum: [1, 2, 3]
          default: 1
        insuranceExpiresOn: { type: string, format: date }
        syntheticAttachmentId: { type: string, pattern: "^synthetic-" }
        requestedMaterialCodes:
          type: array
          items: { type: string }
        decisionCode: { type: string }
        escalationType: { type: string }
        userMessage:
          type: object
          additionalProperties: false
          required: [title, body]
          properties:
            title: { type: string }
            body: { type: string }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/VehicleReviewTimelineItem"
        synthetic: { type: boolean, const: true }
    AdminMaterialReason:
      type: string
      enum: [insurance_expiry_incomplete, authorization_evidence_incomplete, synthetic_attachment_invalid]
    AdminTaskVersionRequest:
      type: object
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion:
          type: integer
          minimum: 0
    AdminDecisionVersionRequest:
      type: object
      required: [previewConfirmed, expectedTaskVersion, expectedVehicleReviewVersion]
      properties:
        previewConfirmed:
          type: boolean
          const: true
        expectedTaskVersion:
          type: integer
          minimum: 0
        expectedVehicleReviewVersion:
          type: integer
          minimum: 0
    AdminRejectionReason:
      type: string
      enum: [vehicle_age_exceeded, vehicle_mileage_exceeded, insurance_requirement_not_met, authorization_remaining_insufficient]
    AdminMaterialReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/AdminMaterialReason"
    AdminReviewTaskSummary:
      type: object
      required: [taskId, applicationId, status, submittedAt, vehicleCategory, queueLabel, taskVersion, synthetic]
      properties:
        taskId: { type: string }
        applicationId: { type: string }
        status: { type: string }
        submittedAt: { type: string, format: date-time }
        vehicleCategory: { type: string }
        queueLabel: { type: string }
        taskVersion: { type: integer }
        synthetic: { type: boolean, const: true }
    AdminReviewTaskDetail:
      allOf:
        - $ref: "#/components/schemas/AdminReviewTaskSummary"
        - type: object
          required: [accountReference, insuranceExpiryStatus, authorizationEvidenceStatus, attachmentValidationStatus, vehicleReviewVersion]
          properties:
            accountReference: { type: string }
            insuranceExpiryStatus: { type: string, enum: [complete, incomplete] }
            authorizationEvidenceStatus: { type: string, enum: [complete, incomplete] }
            attachmentValidationStatus: { type: string, enum: [valid, invalid] }
            vehicleReviewVersion: { type: integer }
            lease:
              type: object
              required: [ownerId, claimedAt, expiresAt]
              properties:
                ownerId: { type: string }
                claimedAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
    AdminMaterialPreview:
      type: object
      required: [reason, title, body, templateVersion, synthetic]
      properties:
        reason:
          $ref: "#/components/schemas/AdminMaterialReason"
        title: { type: string }
        body: { type: string }
        templateVersion: { type: string }
        synthetic: { type: boolean, const: true }
    AdminReviewAuditEntry:
      type: object
      required: [id, occurredAt, actorId, action, outcome, reasonCode, taskId, correlationId, synthetic]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        actorId: { type: string }
        action: { type: string }
        outcome: { type: string, enum: [succeeded, denied] }
        reasonCode: { type: string }
        taskId: { type: string }
        correlationId: { type: string }
        synthetic: { type: boolean, const: true }
    AdminOrganizationContext:
      type: object
      required: [organizationType, organizationId, organizationName, cityScopes, operatorScopes, purpose, fixed]
      properties:
        organizationType: { type: string, enum: [platform, operator, governance] }
        organizationId: { type: string }
        organizationName: { type: string }
        cityScopes:
          type: array
          items: { type: string }
        operatorScopes:
          type: array
          items: { type: string }
        purpose: { type: string, enum: [platform_operations, operator_operations, governance_observation] }
        fixed: { type: boolean }
    AdminInternalSession:
      type: object
      required: [internalUserId, displayName, membershipId, functionalRoles, maximumDataClassification, context, availableContexts, visibleModules, temporaryGrants, synthetic]
      properties:
        internalUserId: { type: string }
        displayName: { type: string }
        membershipId: { type: string }
        functionalRoles:
          type: array
          items: { type: string, enum: [platform_operations_lead, operator_administrator, operator_operations_lead, governance_observer] }
        maximumDataClassification: { type: string, enum: [internal, sensitive, restricted] }
        context:
          $ref: "#/components/schemas/AdminOrganizationContext"
        availableContexts:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrganizationContext"
        visibleModules:
          type: array
          items: { type: string, enum: [platform_workbench, operator_workbench, operator_directory, notifications, audit] }
        temporaryGrants:
          type: array
          items: { type: object, additionalProperties: true }
        synthetic: { type: boolean, const: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              type: string
              description: 必须存在于 spec/api/error-codes.yaml。
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
    FlexEligibilityState:
      type: string
      description: 状态标识来源于 spec/domain/eligibility-states.yaml。
      enum:
        - not_applied
        - under_review
        - rejected
        - awaiting_confirmation
        - awaiting_payment
        - payment_failed
        - pending_activation
        - activation_blocked
        - active
        - suspended
        - pending_restoration
        - appealing
        - revoked
        - expired
        - invalidated
    FlexEligibilityApplicationRequest:
      type: object
      required: [policy_version, consent]
      properties:
        policy_version:
          type: string
        consent:
          type: boolean
          const: true
        material_reference_ids:
          type: array
          items:
            type: string
          maxItems: 20
    FlexEligibilityConfirmationRequest:
      type: object
      required: [terms_version, mode]
      properties:
        terms_version:
          type: string
        mode:
          type: string
          enum: [free_trial, paid_trial]
        price_version:
          type: [string, "null"]
    FlexEligibilityAppealRequest:
      type: object
      required: [decision_id, material_reference_ids]
      properties:
        decision_id:
          type: string
        material_reference_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 20
    EligibilityDecisionRequest:
      type: object
      required: [decision, reason_code, policy_version]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason_code:
          type: string
        policy_version:
          type: string
        confirmation_deadline:
          type: [string, "null"]
          format: date-time
    EligibilityRestrictionRequest:
      type: object
      required: [reason_code, case_id]
      properties:
        reason_code:
          type: string
        case_id:
          type: string
        evidence_reference_ids:
          type: array
          items:
            type: string
          maxItems: 50
    AppealDecisionRequest:
      type: object
      required: [decision, reason_code]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason_code:
          type: string
        compensation:
          type: string
          enum: [none, extend_days, proportional_refund]
    FlexEligibilityResource:
      type: object
      required:
        - eligibility_id
        - state
        - version
        - flex_quota_enabled
        - quota_policy
        - allowed_actions
      properties:
        eligibility_id:
          type: string
        state:
          $ref: "#/components/schemas/FlexEligibilityState"
        version:
          type: integer
          minimum: 0
        flex_quota_enabled:
          type: boolean
          description: 只有 state 为 active 时可以为 true。
        quota_policy:
          type: string
          enum: [base, flex]
        period_start:
          type: [string, "null"]
          format: date-time
        period_end:
          type: [string, "null"]
          format: date-time
        confirmation_deadline:
          type: [string, "null"]
          format: date-time
        appeal_allowed:
          type: boolean
        allowed_actions:
          type: array
          items:
            type: string
    EligibilityFinancialStatus:
      type: object
      required: [eligibility_id, payment_status, refund_status]
      properties:
        eligibility_id:
          type: string
        payment_status:
          type: string
          enum: [not_required, pending, succeeded, failed]
        refund_status:
          type: string
          enum: [none, pending, processing, succeeded, failed, manual_review]
        amount:
          type: [number, "null"]
          minimum: 0
        currency:
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
  responses:
    ValidationError:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthenticationError:
      description: 身份认证失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthorizationError:
      description: 权限或职责分离拒绝
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: 状态、版本或幂等冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BusinessRuleError:
      description: 业务守卫或配额限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"



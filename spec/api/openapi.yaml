    post:
      tags: [InternalSandboxApp]
      operationId: completeAppDriverLivenessChallenge
      summary: 提交合成活体结果并签发一次性上线授权
      description: 内部沙箱只接受明确标识的合成场景，不接收真实视频、照片或人脸模板。
      security:
        - sandboxAuth: []
      parameters:
        - name: challenge_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"

          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverLivenessResult" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/BusinessRuleError" }
  /v1/internal-sandbox/app/driver/availability:
    get:
      tags: [InternalSandboxApp]
      operationId: getAppDriverAvailability
      summary: 查询合成车主可用状态
      security:
        - sandboxAuth: []
      responses:
        "200":
          description: 默认离线且禁止生产启用的车主状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverAvailabilityView" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
    post:
      tags: [InternalSandboxApp]
      operationId: updateAppDriverAvailability
      summary: 由车主主动开始或停止接单
      security:
        - sandboxAuth: []
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, returnOnlineAfterTrip]
              properties:
                state: { type: string, enum: [online, offline] }
                returnOnlineAfterTrip: { type: boolean }
                deviceId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: 当前安装实例的非生物识别设备标识，仅用于绑定本次上线授权。
                livenessAuthorizationToken:
                  type: string
                  description: 请求进入 online 时必填；必须是当前账户、设备和登录会话下未消费的一次性活体授权。请求进入 offline 时禁止携带。
              allOf:
                - if:
                    properties:
                      state: { const: online }
                  then:
                    required: [deviceId, livenessAuthorizationToken]
                - if:
                    properties:
                      state: { const: offline }
                  then:
                    not:
                      required: [livenessAuthorizationToken]
      responses:
        "200":
          description: 更新后的车主状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverAvailabilityView" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/BusinessRuleError" }

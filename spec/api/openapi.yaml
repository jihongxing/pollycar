                        items:
                          type: array
                          items:
                            type: object
                            required: [resultId, domain, kind, title, description, route]
                            additionalProperties: false
                            properties:
                              resultId: { type: string }
                              domain: { type: string }
                              kind: { type: string }
                              title: { type: string }
                              description: { type: string }
                              route: { type: string }
                  totalResults: { type: integer, minimum: 0 }
                  asOf: { type: string, format: date-time }
                  synthetic: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/admin/reports:
    get:
      tags: [InternalSandboxAdmin]
      operationId: listAdminDataReports
      summary: 查询组织范围内去标识聚合报表名录
      security:
        - sandboxAuth: []
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: domain, in: query, required: false, schema: { type: string, enum: [operations, finance, safety_compliance, audit] } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [ready, partial, stale] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [refreshed_at_desc, report_id_asc] } }
        - { name: page_size, in: query, required: false, schema: { type: integer, enum: [25, 50, 100] } }
        - { name: after, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: 报表摘要、筛选结果和签名游标分页名录
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/admin/reports/{report_id}:
    get:
      tags: [InternalSandboxAdmin]
      operationId: getAdminDataReport
      summary: 查询去标识聚合报表详情
      security:
        - sandboxAuth: []
      parameters:
        - { name: report_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 聚合指标、角色允许动作、数据边界和追加式审计
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/admin/reports/{report_id}/actions/refresh_report:
    post:
      tags: [InternalSandboxAdmin]
      operationId: refreshAdminDataReport
      summary: 按角色职责域刷新报表快照
      security:
        - sandboxAuth: []
      parameters:
        - { name: report_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, reasonCode]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                reasonCode: { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        "200":
          description: 已确认的报表刷新结果与追加式审计
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/admin/audit:
    get:
      tags: [InternalSandboxAdmin]
      operationId: listAdminAuditResources
      summary: 查询统一审计事件与受控调查资源名录
      security:
        - sandboxAuth: []
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [event, investigation] } }
        - { name: domain, in: query, required: false, schema: { type: string } }
        - { name: result, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: 脱敏审计摘要、筛选选项和签名游标分页名录
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/admin/audit/{kind}/{resource_id}:
    get:
      tags: [InternalSandboxAdmin]
      operationId: getAdminAuditResource
      summary: 查询统一审计事件或受控调查详情
      security:
        - sandboxAuth: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [event, investigation] } }
        - { name: resource_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 脱敏事件元数据、完整性摘要或调查详情与追加式轨迹
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/admin/audit/{kind}/{resource_id}/actions/{action}:
    post:
      tags: [InternalSandboxAdmin]
      operationId: performAdminAuditAction
      summary: 技术运维执行不改变领域业务状态的受控调查操作
      security:
        - sandboxAuth: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [event, investigation] } }
        - { name: resource_id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [open_investigation, assign_investigation, add_investigation_note, resolve_investigation, reopen_investigation] } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                assigneeInternalUserId: { type: string }
                note: { type: string }
                resolutionCode: { type: string }
              additionalProperties: false
      responses:
        "200":
          description: 结果确认状态、更新后的调查详情和追加式审计
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/internal-sandbox/health:
    get:
      tags: [InternalSandboxAdmin]
      operationId: getInternalSandboxHealth
      summary: 查询内部沙箱健康状态
      security:
        - sandboxAuth: []
      responses:
        "200":
          description: 沙箱组件健康状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    avatarMediaToken:
      type: apiKey
      in: query
      name: access
      bearerFormat: JWT
    sandboxAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 仅内部沙箱接受预置合成身份，不得用于生产。
    identityProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: 身份核验供应商回调签名；Server 必须验证签名、时间窗、任务归属和重放。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: 同一业务动作重试必须使用相同值。
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: 当前安装实例的非生物识别设备标识；服务端只持久化摘要。
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        type: string
    EligibilityId:
      name: eligibility_id
      in: path
      required: true
      schema:
        type: string
    AppealId:
      name: appeal_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^synthetic-"
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^safety-synthetic-"
  schemas:
    GeoPoint:
      type: object
      required: [latitude, longitude, coordinateSystem]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        coordinateSystem: { type: string, enum: [wgs84, gcj02] }
    RequestPhoneCodeRequest:
      type: object
      required: [phoneNumber, consentAccepted, deviceId, idempotencyKey]
      properties:
        phoneNumber: { type: string, pattern: "^1[3-9][0-9]{9}$" }
        consentAccepted: { type: boolean, const: true }
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    VerifyPhoneCodeRequest:
      type: object
      required: [challengeId, code, deviceId, idempotencyKey]
      properties:
        challengeId: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    RefreshPhoneSessionRequest:
      type: object
      required: [refreshToken, deviceId, idempotencyKey]
      properties:
        refreshToken: { type: string, minLength: 32 }
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    PhoneCodeChallenge:
      type: object
      required: [challengeId, maskedPhoneNumber, state, expiresAt, resendAvailableAt, attemptsRemaining, synthetic]
      properties:
        challengeId: { type: string }
        maskedPhoneNumber: { type: string }
        state: { type: string, enum: [pending, consumed, expired, locked, superseded, delivery_unknown] }
        expiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, minimum: 0, maximum: 5 }
        synthetic: { type: boolean, const: true }
    PhoneAuthenticationResult:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt, account, session]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshTokenExpiresAt: { type: string, format: date-time }
        account:
          type: object
          required: [accountId, state, isNewAccount, adultEligibilityState, businessAccessAllowed, nextStep, synthetic]
          properties:
            accountId: { type: string }
            state: { type: string }
            isNewAccount: { type: boolean }
            adultEligibilityState: { type: string }
            businessAccessAllowed: { type: boolean }
            nextStep: { type: string, enum: [adult_eligibility, ride_home, restricted] }
            synthetic: { type: boolean, const: true }
        session: { $ref: "#/components/schemas/InternalAccountSession" }
    CreateInternalAccountSessionRequest:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          enum: [synthetic-account-7, synthetic-passenger-8, synthetic-unverified-9]
    CreateInternalAccountSessionResponse:
      type: object
      additionalProperties: false
      required: [token, session]
      properties:
        token: { type: string, pattern: "^synthetic-session-" }
        session: { $ref: "#/components/schemas/InternalAccountSession" }
    InternalAccountSession:
      type: object
      additionalProperties: false
      required: [sessionId, accountId, activeIdentity, availableIdentities, adultEligibilityState, businessAccessAllowed, issuedAt, expiresAt, state, productionEnabled, synthetic]
      properties:
        sessionId: { type: string, pattern: "^session-" }
        accountId: { type: string, pattern: "^synthetic-" }
        activeIdentity: { type: string, enum: [passenger, driver] }
        availableIdentities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [passenger, driver] }
        adultEligibilityState: { type: string }
        businessAccessAllowed: { type: boolean }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        state: { type: string, enum: [active, expired, revoked] }
        productionEnabled: { type: boolean, const: false }
        synthetic: { type: boolean, const: true }
    AccountTrustProfile:
      type: object
      required: [accountId, avatar, synthetic]
      properties:
        accountId: { type: string }
        avatar:
          type: object
          required: [state, source, customUploadEnabled, realUploadEnabled, synthetic]
          properties:
            state: { type: string, enum: [default, pending, approved, rejected] }
            source: { type: string, enum: [default, preset, custom] }
            publicUrl: { type: string, format: uri-reference }
            rejectionReason: { type: string, enum: [face_missing, multiple_people, unsafe_content] }
            customUploadEnabled: { const: true }
            realUploadEnabled: { const: false }
            synthetic: { const: true }
        rating:
          type: object
          required: [average, ratingCount]
          properties:
            average: { type: number, minimum: 1, maximum: 5 }
            ratingCount: { type: integer, minimum: 0 }
        synthetic: { const: true }
    TripRating:
      type: object
      required: [ratingId, tripId, raterAccountId, subjectAccountId, score, tags, createdAt, synthetic]
      properties:
        ratingId: { type: string }
        tripId: { type: string }
        raterAccountId: { type: string }
        subjectAccountId: { type: string }
        score: { type: integer, minimum: 1, maximum: 5 }
        tags: { type: array, items: { type: string } }
        note: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
        synthetic: { const: true }
    FairnessMonitoringReport:
      type: object
      required: [dimension, rows, alert, thresholdPercentagePoints, automatedDecisionEnabled, synthetic]
      properties:
        dimension: { const: legal_gender }
        rows: { type: array, items: { type: object } }
        alert: { type: boolean }
        thresholdPercentagePoints: { type: number }
        automatedDecisionEnabled: { const: false }
        synthetic: { const: true }
    AdultEligibilityVerification:
      type: object
      required: [accountId, state, version, checks, recoveryAction, businessAccessAllowed, realIdentityDataEnabled, realBiometricDataEnabled, externalIdentityProviderEnabled, consent, synthetic]
      properties:
        accountId: { type: string }
        state: { type: string, enum: [not_started, collecting, processing, needs_retry, needs_review, verified, rejected, expired, suspended, revoked] }
        version: { type: integer, minimum: 0 }
        checks: { type: object, additionalProperties: true }
        recoveryAction: { type: string }
        businessAccessAllowed: { type: boolean }
        realIdentityDataEnabled: { type: boolean, const: false }
        realBiometricDataEnabled: { type: boolean, const: false }
        externalIdentityProviderEnabled: { type: boolean, const: false }
        consent: { type: object, additionalProperties: true }
        appeal: { type: object, additionalProperties: true }
        synthetic: { type: boolean, const: true }
    AdultEligibilitySdkSession:
      type: object
      required: [sessionId, providerId, clientToken, expiresAt, sdkMode, requestedChecks, realIdentityDataEnabled, realBiometricDataEnabled, externalIdentityProviderEnabled]
      properties:
        sessionId: { type: string }
        providerId: { type: string }
        clientToken: { type: string }
        expiresAt: { type: string, format: date-time }
        sdkMode: { type: string, enum: [synthetic, native] }
        requestedChecks:
          type: array
          items: { type: string, enum: [identity_document, adult_age, liveness, face_match] }
        realIdentityDataEnabled: { type: boolean, const: false }
        realBiometricDataEnabled: { type: boolean, const: false }
        externalIdentityProviderEnabled: { type: boolean, const: false }
      additionalProperties: false
    TripChatMessage:
      type: object
      required: [messageId, senderAccountId, body, sentAt, deliveryState, synthetic]
      properties:
        messageId: { type: string }
        senderAccountId: { type: string }
        body: { type: string, maxLength: 500 }
        sentAt: { type: string, format: date-time }
        deliveryState: { type: string, enum: [sent, failed, unknown] }
        synthetic: { type: boolean, const: true }
      additionalProperties: false
    TripChatView:
      type: object
      required: [conversationId, tripId, state, participants, messages, quickReplies, retention, realChatEnabled, externalChatProviderEnabled, synthetic]
      properties:
        conversationId: { type: string }
        tripId: { type: string }
        state: { type: string, enum: [scheduled, open, frozen, expired, closed] }
        participants:
          type: array
          items: { $ref: "#/components/schemas/TripPartyPublicProfile" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/TripChatMessage" }
        quickReplies:
          type: array
          items: { type: string }
        openedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        retention:
          type: object
          required: [evidenceHold, deletionState, summaryRetained]
          properties:
            contentDeleteAfter: { type: string, format: date-time }
            evidenceHold: { type: boolean }
            deletionState: { type: string, enum: [not_due, eligible, blocked_by_hold, deleted] }
            summaryRetained: { const: true }
          additionalProperties: false
        realChatEnabled: { type: boolean, const: false }
        externalChatProviderEnabled: { type: boolean, const: false }
        synthetic: { type: boolean, const: true }
      additionalProperties: false
    MessageCenterTarget:
      oneOf:
        - type: object
          required: [kind, tripId]
          properties:
            kind: { const: trip_chat }
            tripId: { type: string }
          additionalProperties: false
        - type: object
          required: [kind, tripId]
          properties:
            kind: { const: trip }
            tripId: { type: string }
          additionalProperties: false
        - type: object
          required: [kind]
          properties:
            kind: { const: vehicle_review }
            reviewId: { type: string }
          additionalProperties: false
        - type: object
          required: [kind]
          properties:
            kind: { const: eligibility }
          additionalProperties: false
        - type: object
          required: [kind, caseId]
          properties:
            kind: { const: safety_case }
            caseId: { type: string }
          additionalProperties: false
    MessageCenterItem:
      type: object
      required: [itemId, category, title, body, occurredAt, pinned, target, synthetic]
      properties:
        itemId: { type: string }
        category: { type: string, enum: [trip_chat, trip_service, vehicle_review, eligibility, safety] }
        title: { type: string }
        body: { type: string }
        occurredAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
        pinned: { type: boolean }
        target: { $ref: "#/components/schemas/MessageCenterTarget" }
        synthetic: { type: boolean, const: true }
      additionalProperties: false
    MessageCenterView:
      type: object
      required: [items, unreadCount, realPushEnabled, externalNotificationProviderEnabled, synthetic]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MessageCenterItem" }
        unreadCount: { type: integer, minimum: 0 }
        realPushEnabled: { type: boolean, const: false }
        externalNotificationProviderEnabled: { type: boolean, const: false }
        synthetic: { type: boolean, const: true }
      additionalProperties: false
    TemporaryChatView:
      type: object
      additionalProperties: false
      required: [tripId, state, messages, synthetic]
      properties:
        tripId: { type: string, pattern: "^synthetic-" }
        state: { type: string, enum: [closed, open, frozen] }
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [messageId, senderAccountId, body, sentAt, synthetic]
            properties:
              messageId: { type: string, pattern: "^synthetic-" }
              senderAccountId: { type: string, pattern: "^synthetic-" }
              body: { type: string, pattern: "^合成消息：" }
              sentAt: { type: string, format: date-time }
              synthetic: { type: boolean, const: true }
        expiresAt: { type: string, format: date-time }
        synthetic: { type: boolean, const: true }
    SafetyCaseView:
      type: object
      additionalProperties: false
      required: [caseId, tripId, reporterAccountId, reportedAccountId, reasonCode, state, version, createdAt, synthetic]
      properties:
        caseId: { type: string, pattern: "^safety-synthetic-" }
        tripId: { type: string, pattern: "^synthetic-" }
        reporterAccountId: { type: string, pattern: "^synthetic-" }
        reportedAccountId: { type: string, pattern: "^synthetic-" }
        reasonCode: { type: string, enum: [unsafe_behavior, harassment, identity_concern] }
        state: { type: string, enum: [open_frozen, appealing, restored, upheld] }
        version: { type: integer, minimum: 1 }
        appealReasonCode: { type: string, enum: [context_missing, misunderstanding, new_evidence] }
        resolutionCode: { type: string, enum: [restore_access, uphold_freeze] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        synthetic: { type: boolean, const: true }
    AdminSafetyCaseSummary:
      type: object
      additionalProperties: false
      required: [caseId, tripId, state, reasonCode, createdAt, hasAppeal, synthetic]
      properties:
        caseId: { type: string, pattern: "^safety-synthetic-" }
        tripId: { type: string, pattern: "^synthetic-" }
        state: { type: string, enum: [open_frozen, appealing, restored, upheld] }
        reasonCode: { type: string, enum: [unsafe_behavior, harassment, identity_concern] }
        createdAt: { type: string, format: date-time }
        hasAppeal: { type: boolean }
        synthetic: { type: boolean, const: true }
    AdminSafetyCaseDetail:
      allOf:
        - $ref: "#/components/schemas/AdminSafetyCaseSummary"
        - type: object
          additionalProperties: false
          required: [reporterAccountReference, reportedAccountReference, version, disclosure]
          properties:
            reporterAccountReference: { type: string, pattern: "^合成账户" }
            reportedAccountReference: { type: string, pattern: "^合成账户" }
            appealReasonCode: { type: string, enum: [context_missing, misunderstanding, new_evidence] }
            version: { type: integer, minimum: 1 }
            disclosure:
              type: object
              additionalProperties: false
              required: [chatBodyAvailable, rawEvidenceAvailable]
              properties:
                chatBodyAvailable: { type: boolean, const: false }
                rawEvidenceAvailable: { type: boolean, const: false }
    SafetyDashboard:
      type: object
      additionalProperties: false
      required: [realChatEnabled, realEvidenceEnabled]
      properties:
        chat:
          $ref: "#/components/schemas/TemporaryChatView"
        safetyCase:
          $ref: "#/components/schemas/SafetyCaseView"
        realChatEnabled: { type: boolean, const: false }
        realEvidenceEnabled: { type: boolean, const: false }

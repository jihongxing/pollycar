name: 质量与安全门禁

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  POLLYCAR_BUILD_NODE_VERSION: "22"
  POLLYCAR_BUILD_PNPM_VERSION: "10.22.0"
  POLLYCAR_BUILD_JAVA_VERSION: "17"
  POLLYCAR_BUILD_EAS_CLI_VERSION: "21.4.0"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:build-config container-evidence
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm --filter @pollycar/contracts build
      - run: pnpm --filter @pollycar/domain build
      - run: pnpm test
      - run: pnpm build
      - run: pwsh scripts/test/check-doc-governance.ps1
      - run: pwsh scripts/test/check-feature-gate-alignment.ps1

name: 供应链证据

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sbom:generate
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: output/image-context.sbom.cdx.json
      - uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: output/vulnerability-scan.json
          exit-code: "1"
          severity: HIGH,CRITICAL
      - run: node scripts/infra/generate-container-supply-chain-report.mjs output/container-supply-chain/report.json output/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: output/

  publish-and-sign:
    needs: evidence
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.POLLYCAR_IMAGE_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infrastructure/local-production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pollycar:${{ github.ref_name }}
          build-args: |
            POLLYCAR_NODE_IMAGE_DIGEST=${{ vars.POLLYCAR_NODE_IMAGE_DIGEST }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/pollycar:${{ github.ref_name }}
